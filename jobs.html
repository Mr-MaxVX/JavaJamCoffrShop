        <h2>Jobs at JavaJam</h2>
<body>
    Want to work at JavaJam? Fill out the form below to start your application. Required fields are marked with an asterisk (*).
</body>


    <main> 
        
    <form action="http://webdevbasics.net/scripts/javajam.php" method="post"> <!-- The server configuration that we might touch upon it in the future-->
        <!--the get method consider unsecure cuz it shows the request on the page? Hmm idk-->
        
        <span><!--same as div but an inline element container (; -->

            <label for="myName"> * Name : </label> <!-- from what I understand is that the for=smh & id=smh are there
            to point for the element while name=smh is a way to assign the inputs to a var which the server will handle later on-->
            <input type="text" name="myName" id="myName" placeholder="Enter your name" required>
        </span>

        <span>
            <label for="myEmail"> * E-mail :</label>
            <input type="email" name="myEmail" id="myEmail" placeholder="example@email.com" required>
        </span>


        <span>
            <label for="myExperience" > * Experience :</label>
            <textarea id="myExperience" name="myExperience" rows="2" cols="20">  </textarea>
            <!-- I thought of a reset key in case someone wanna erase what he wrote-->
            <input type="reset" value="Reset">
            <!--the issue here the reset button doesn't reset the Experience textarea, we can mitigate that by using js 
            but we can't do it in form-form or make this stand-alone form off the box cuz we need to send these inputs to server.-->
        </span>


        <div> 
            <input type="submit" value="Apply Now" id="mySubmit"> 
        </div>
 
    </form>

</main>
